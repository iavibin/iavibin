name: Generate Contribution Snake

permissions:
  contents: write

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: iavibin
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#C30000&color_dots=#ebedf0,#ffc0c0,#ff7070,#d62828,#C30000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C30000&color_dots=#161b22,#4c0a0a,#781010,#a31414,#C30000

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
